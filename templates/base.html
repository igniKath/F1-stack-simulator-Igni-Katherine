<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Stack Simulator Starter{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- TODO H1: During the demo replace this relative URL with url_for('static', ...). CHECKED-->
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
<main class="container py-4">
  <!-- TODO H2: Replace file links with Flask route links during the demo.CHECKED -->
  <nav class="mb-4" aria-label="Main navigation">
    <a href="{{url_for('index')}}">Stack simulator</a>
    <a class="ms-3" href="{{url_for('contact')}}">Contact placeholder</a>
  </nav>

<!-- Layout reference only: index.html and contact.html are independent static pages. BABALIKAN -->
{% for category, message in get_flashed_messages(with_categories=true) %}
<p role="status" class="notice {{ category }}">{{ message }}</p>
<!-- TODO H3: Add the Flask flash-message loop. -->
{% endfor %}

<!-- TODO H8: Add Jinja title and content blocks, then let child pages extend this file. CHECKED -->
{% block content %}{% endblock %}


</main>
<script src="https://code.jquery.com/jquery-3.6.3.min.js"></script>
<!-- TODO H1: Build this static asset URL with url_for during the demo. CHECKED -->

<script src="{{ url_for('static', filename='js/ui.js') }}"></script>
</body>
</html>
